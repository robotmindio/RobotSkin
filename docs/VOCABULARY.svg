<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <style>
    text{font-family:Arial,sans-serif;fill:#152536} .title{font-size:7px;font-weight:bold}
    .h{font-size:4.2px;font-weight:bold}.b{font-size:3.2px}.s{font-size:2.7px}
    .part{fill:#dce9f4;stroke:#365b78;stroke-width:.8}.join{fill:#f5b72d;stroke:#9a6710;stroke-width:.8}
    .line{stroke:#365b78;stroke-width:.55;fill:none}.port{fill:none;stroke:#365b78;stroke-width:.7}
    .peg{fill:#f5b72d;stroke:#9a6710;stroke-width:.55}.rule{stroke:#9aabb8;stroke-width:.35}
  </style>
  <rect width="210" height="297" fill="white"/>
  <text x="12" y="14" class="title">RobotMind — parts and connection vocabulary</text>
  <text x="12" y="20" class="b">Print at 100% on A4. Orange = join/peg; blue = plate/plaque.</text>
  <line x1="12" y1="24" x2="198" y2="24" class="rule"/>

  <text x="12" y="33" class="h">Parts</text>
  <rect x="14" y="39" width="37" height="37" rx="3" class="part"/>
  <g class="port"><circle cx="20" cy="45" r="2"/><circle cx="29" cy="45" r="2"/><circle cx="38" cy="45" r="2"/><circle cx="45" cy="45" r="2"/><circle cx="20" cy="54" r="2"/><circle cx="29" cy="54" r="2"/><circle cx="38" cy="54" r="2"/><circle cx="45" cy="54" r="2"/><circle cx="20" cy="63" r="2"/><circle cx="29" cy="63" r="2"/><circle cx="38" cy="63" r="2"/><circle cx="45" cy="63" r="2"/><circle cx="20" cy="70" r="2"/><circle cx="29" cy="70" r="2"/><circle cx="38" cy="70" r="2"/><circle cx="45" cy="70" r="2"/></g>
  <circle cx="20" cy="45" r="1" fill="#365b78"/><circle cx="45" cy="45" r="1" fill="#365b78"/><circle cx="20" cy="70" r="1" fill="#365b78"/><circle cx="45" cy="70" r="1" fill="#365b78"/>
  <text x="14" y="82" class="h">Single-sided plate</text><text x="14" y="87" class="s">64 ports; corner ports also mount</text>

  <rect x="67" y="54" width="20" height="13" class="join"/>
  <g class="port"><circle cx="74" cy="60.5" r="2"/><circle cx="81" cy="60.5" r="2"/></g>
  <text x="67" y="82" class="h">Flat join</text><text x="67" y="87" class="s">20 mm coplanar tile</text>

  <path d="M128 70V42H163V51H137V70Z" class="join"/>
  <text x="128" y="82" class="h">Inner 90° join</text><text x="128" y="87" class="s">20 mm inside-corner tile</text>

  <path d="M16 125V97H51V106H25V125Z" class="join"/>
  <text x="14" y="136" class="h">Outer 90° join</text><text x="14" y="141" class="s">20 mm outside-corner tile</text>

  <rect x="68" y="101" width="28" height="28" rx="3" class="part"/>
  <circle cx="75" cy="108" r="2.4" class="port"/><circle cx="89" cy="108" r="2.4" class="port"/>
  <path d="M75 118h14M82 111v14" class="line"/>
  <text x="67" y="136" class="h">Grove plaque</text><text x="67" y="141" class="s">Small-board carrier</text>

  <text x="12" y="157" class="h">Connection vocabulary</text>
  <rect x="14" y="164" width="74" height="46" rx="3" class="part"/>
  <path d="M25 198V176H49V198" fill="white" stroke="#365b78" stroke-width="1.2"/>
  <path d="M30 193V180H44V193" fill="none" stroke="#365b78" stroke-width="1"/>
  <circle cx="37" cy="187" r="4" fill="white" stroke="#365b78" stroke-width=".8"/>
  <circle cx="37" cy="187" r="2" fill="#bc7616"/>
  <rect x="54" y="168" width="25" height="8" rx="2" class="join"/>
  <path d="M66.5 176v11" class="peg" stroke-width="5"/>
  <circle cx="66.5" cy="181.5" r="1.5" fill="white"/>
  <path d="M66.5 168v7" class="line"/><path d="M66.5 168l-1.5 2M66.5 168l1.5 2" class="line"/>
  <text x="92" y="170" class="h">Port (female)</text><text x="92" y="175" class="b">Octagonal socket in the plate.</text>
  <text x="92" y="184" class="h">Peg (male)</text><text x="92" y="189" class="b">Octagonal feature that enters a port.</text>
  <text x="92" y="198" class="h">Insert seat</text><text x="92" y="203" class="b">4.6 mm entry cup leading to a 3.7 mm brass-insert pilot.</text>
  <text x="14" y="218" class="h">Lock station</text><text x="14" y="223" class="b">One peg, its screw-clearance path, and its matching port.</text>
  <text x="14" y="231" class="h">Join panel</text><text x="14" y="236" class="b">The continuous orange surface holding every lock station together.</text>
  <text x="14" y="244" class="h">Permanent lock</text><text x="14" y="249" class="b">A brass M3×3×4 insert in the plate port plus an M3×6 pan-head screw.</text>
  <text x="14" y="257" class="h">Press-fit assembly</text><text x="14" y="262" class="b">Peg inserted by hand without a screw; removable after fit calibration.</text>
  <line x1="12" y1="270" x2="198" y2="270" class="rule"/>
  <text x="12" y="278" class="s">Run the tolerance kit before production printing. Inner and outer angle joins are different parts.</text>
</svg>
