<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    text{font-family:Arial,sans-serif;fill:#18212b} .h{font-size:28px;font-weight:bold}.t{font-size:18px}.n{font-size:20px;font-weight:bold;fill:white}.part{fill:#dceeff;stroke:#24557a;stroke-width:3}.metal{fill:#e6c767;stroke:#725d18;stroke-width:3}.arrow{stroke:#18212b;stroke-width:3;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#18212b"/></marker></defs>
  <text x="40" y="48" class="h">RobotSkin V0.1 — assembly sequence</text>
  <g transform="translate(40 90)">
    <circle cx="28" cy="28" r="24" fill="#24557a"/><text x="22" y="35" class="n">1</text>
    <rect x="90" y="20" width="240" height="90" rx="10" class="part"/><circle cx="210" cy="46" r="18" fill="white" stroke="#24557a" stroke-width="3"/>
    <rect x="197" y="-25" width="26" height="40" class="metal"/><path d="M210 10v28" class="arrow"/>
    <text x="90" y="145" class="t">Heat-set M3 insert flush into the plate port.</text>
  </g>
  <g transform="translate(430 90)">
    <circle cx="28" cy="28" r="24" fill="#24557a"/><text x="22" y="35" class="n">2</text>
    <rect x="90" y="70" width="260" height="50" rx="8" class="part"/><path d="M125 70l12-28h26l12 28M245 70l12-28h26l12 28" class="part"/>
    <rect x="100" y="-15" width="240" height="32" rx="8" class="part"/><path d="M220 20v38" class="arrow"/>
    <text x="90" y="155" class="t">Align every peg; press the parts together.</text>
  </g>
  <g transform="translate(820 90)">
    <circle cx="28" cy="28" r="24" fill="#24557a"/><text x="22" y="35" class="n">3</text>
    <rect x="90" y="70" width="260" height="50" rx="8" class="part"/><rect x="100" y="20" width="240" height="30" rx="8" class="part"/>
    <rect x="205" y="-25" width="16" height="85" class="metal"/><path d="M213 -35v25" class="arrow"/>
    <text x="90" y="150" class="t">Drive M3×6 through the peg</text><text x="90" y="176" class="t">into the insert.</text>
  </g>
  <line x1="40" y1="300" x2="1160" y2="300" stroke="#aab4bd" stroke-width="2"/>
  <text x="40" y="345" class="h">Carrier order</text>
  <rect x="110" y="570" width="360" height="55" rx="8" class="part"/><text x="235" y="605" class="t">RobotSkin plate</text>
  <path d="M175 570v-55M405 570v-55" class="arrow"/>
  <rect x="145" y="455" width="290" height="45" rx="8" class="part"/><text x="230" y="485" class="t">Empty carrier</text>
  <path d="M210 455v-55M370 455v-55" class="arrow"/>
  <rect x="175" y="350" width="230" height="35" rx="4" fill="#547a43" stroke="#233d1d" stroke-width="3"/><text x="250" y="375" class="n">PCB last</text>
  <text x="550" y="410" class="t">A. Install plate inserts.</text><text x="550" y="450" class="t">B. Fasten the empty carrier to the plate.</text><text x="550" y="490" class="t">C. Install PCB and its payload screws.</text>
  <text x="550" y="545" class="t">UNO: four M3×4 screws into standoff inserts.</text><text x="550" y="585" class="t">Grove: four M2.5×6 thread-forming screws.</text><text x="550" y="625" class="t">Never substitute M3×6 for the UNO PCB screws.</text>
</svg>
