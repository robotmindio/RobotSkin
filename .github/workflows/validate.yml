name: Validate OpenSCAD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  stl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad xvfb
          python -m pip install "trimesh==4.8.3"
      - name: Build, validate, and package
        run: xvfb-run --auto-servernum ./scripts/package_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: robotskin-engineering-package
          path: dist/*
          if-no-files-found: error
