name: Validate OpenSCAD

on:
  push:
  pull_request:

jobs:
  stl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad xvfb
          python -m pip install "trimesh==4.8.3"
      - name: Build production meshes
        run: xvfb-run --auto-servernum ./scripts/build.sh
      - name: Reject invalid or floating shells
        run: python scripts/validate_stl.py stl/*.stl
